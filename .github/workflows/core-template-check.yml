name: Core template checks

# Bounded validation for the existing work branch; never deploys or publishes.
on:
  push:
    branches: [work/ai-first-core-20261027]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-template-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core-role-checks:
    if: github.ref == 'refs/heads/work/ai-first-core-20261027'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUSTZEN_SKIP_DOTENV: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record source identity
        run: |
          mkdir -p "$RUNNER_TEMP/rz-core-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/rz-core-evidence/source-commit.txt"
          git archive --format=tar.gz -o "$RUNNER_TEMP/rz-core-evidence/source.tar.gz" HEAD
      - name: Set up the declared Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
      - name: Prepare pinned tools
        run: |
          npm install --global bun@1.3.14 pnpm@11.25.0
          rustup toolchain install 1.95.0 --profile minimal
          test "$(node --version)" = v24.15.0
          test "$(bun --version)" = 1.3.14
          { node --version; bun --version; pnpm --version; rustc --version; cargo --version; } \
            | tee "$RUNNER_TEMP/rz-core-evidence/tool-versions.txt"
      - name: Install locked Web dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/rz-core-evidence/web-install.log"
      - name: Build the real core Web composition
        working-directory: apps/web
        run: bun run build:core 2>&1 | tee "$RUNNER_TEMP/rz-core-evidence/core-web-build.log"
      - name: Check Web types and role tests
        working-directory: apps/web
        run: |
          bun x tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/rz-core-evidence/web-types.log"
          bun test tests/role-composition.seam.test.mjs src/routes/system/-role-delete-state.test.ts \
            2>&1 | tee "$RUNNER_TEMP/rz-core-evidence/web-role-tests.log"
      - name: Run native core role regressions
        run: |
          run_suite() {
            local name="$1" filter="$2"
            cargo test --locked -p rustzen-admin --no-default-features --features core \
              "$filter" -- --list | tee "$RUNNER_TEMP/rz-core-evidence/$name-selection.txt"
            grep -q ': test$' "$RUNNER_TEMP/rz-core-evidence/$name-selection.txt"
            cargo test --locked -p rustzen-admin --no-default-features --features core \
              "$filter" -- --test-threads=1 \
              2>&1 | tee "$RUNNER_TEMP/rz-core-evidence/$name-tests.log"
          }
          run_suite rust-role features::system::role::
          run_suite rust-role-route infra::app::tests::roles::
      - name: Bind retained evidence
        if: always()
        run: |
          if [ -f apps/web/dist-core/inventory.json ]; then
            cp apps/web/dist-core/inventory.json "$RUNNER_TEMP/rz-core-evidence/core-web-inventory.json"
          fi
          cd "$RUNNER_TEMP/rz-core-evidence"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 -r sha256sum > SHA256SUMS
      - name: Retain source and verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-template-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/rz-core-evidence/
          if-no-files-found: error
          retention-days: 30
