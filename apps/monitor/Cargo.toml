[package]
authors = ["Bruce Dai <bruce@idaibin.dev>"]
name = "rustzen-monitor"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false
default-run = "rz-monitor"

[[bin]]
name = "rz-monitor"
path = "src/main.rs"
required-features = ["controller"]

[[bin]]
name = "rz-monitor-agent"
path = "src/agent_main.rs"
required-features = ["agent"]

[features]
default = ["controller"]
controller = [
    "dep:axum",
    "dep:rustzen-auth",
    "dep:rustzen-ipc",
    "dep:rustzen-storage",
    "dep:sqlx",
    "rustzen-config/monitor-controller",
]
agent = ["dep:reqwest", "dep:sysinfo", "rustzen-config/monitor-agent"]

[dependencies]
axum = { version = "0.8", features = ["macros"], optional = true }
tokio = { version = "1", features = ["full", "test-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustzen-auth = { path = "../../crates/auth", optional = true }
rustzen-config = { path = "../../crates/config", default-features = false }
rustzen-ipc = { path = "../../crates/ipc", optional = true }
rustzen-runtime = { path = "../../crates/runtime" }
rustzen-storage = { path = "../../crates/storage", optional = true }
tracing = "0.1"
sqlx = { version = "0.9.0", optional = true, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "uuid",
    "migrate",
] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.17", features = ["v4", "serde"] }
sysinfo = { version = "0.39.3", optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"], optional = true }
