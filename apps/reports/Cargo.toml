[package]
name = "rustzen-reports"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[[bin]]
name = "rz-reports"
path = "src/main.rs"

[features]
default = ["notifications"]
notifications = ["dep:hex", "dep:reqwest", "dep:sha2", "rustzen-config/reports-notifications"]
selected-distribution = []

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
chromiumoxide = "0.9.1"
futures = "0.3"
rustzen-auth = { path = "../../crates/auth" }
rustzen-config = { path = "../../crates/config", default-features = false, features = ["reports"] }
rustzen-ipc = { path = "../../crates/ipc" }
rustzen-runtime = { path = "../../crates/runtime" }
rustzen-storage = { path = "../../crates/storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "uuid",
    "migrate",
] }
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
uuid = { version = "1.17", features = ["v4", "serde"] }
url = "2"
hex = { version = "0.4", optional = true }
sha2 = { version = "0.10", optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"], optional = true }

[dev-dependencies]
tower = "0.5"
