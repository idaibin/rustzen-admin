[package]
authors = ["Bruce Dai <bruce@idaibin.dev>"]
name = "rustzen-admin"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[[bin]]
name = "rz-admin"
path = "src/main.rs"


[dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2.2"
rustzen-auth = { path = "../../crates/auth" }
rustzen-config = { path = "../../crates/config" }
rustzen-ipc = { path = "../../crates/ipc" }
rustzen-runtime = { path = "../../crates/runtime" }
rustzen-storage = { path = "../../crates/storage" }
tracing = "0.1"
once_cell = "1.21"
# for CORS and logging middleware
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

# database related dependencies
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "uuid",
    "migrate",
] }
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.17", features = ["v4", "serde"] }
async-trait = "0.1"
croner = "3.0.1"

# password hashing
argon2 = "0.6.0-rc.8"
sysinfo = "0.39.3"
tokio-stream = "0.1.17"
futures = "0.3.31"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls", "stream"] }
rust-embed = "8.11.0"
mime_guess = "2.0.5"
tar = "0.4"
utoipa = { version = "=5.5.0", features = ["chrono"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
