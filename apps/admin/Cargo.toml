[package]
authors = ["Bruce Dai <bruce@idaibin.dev>"]
name = "rustzen-admin"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[features]
default = ["full"]
full = [
    "notifications",
    "rustzen-config/admin",
    "dep:croner",
    "dep:ed25519-dalek",
    "dep:hex",
    "dep:image",
    "dep:libc",
    "dep:mime_guess",
    "dep:rust-embed",
    "dep:sysinfo",
    "dep:tar",
    "tower-http/fs",
]
monitor-distribution = ["rustzen-config/admin-monitor", "dep:rust-embed", "dep:mime_guess"]
notifications = ["dep:aes-gcm", "dep:base64"]

[[bin]]
name = "rz-admin"
path = "src/main.rs"


[dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = { version = "0.22", optional = true }
aes-gcm = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }
ed25519-dalek = { version = "2.2", optional = true }
rustzen-auth = { path = "../../crates/auth" }
rustzen-config = { path = "../../crates/config", default-features = false }
rustzen-ipc = { path = "../../crates/ipc" }
rustzen-runtime = { path = "../../crates/runtime" }
rustzen-storage = { path = "../../crates/storage" }
tracing = "0.1"
once_cell = "1.21"
# for CORS and logging middleware
tower-http = { version = "0.6", features = ["cors", "trace"] }

# database related dependencies
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "uuid",
    "migrate",
] }
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.17", features = ["v4", "serde"] }
async-trait = "0.1"
croner = { version = "3.0.1", optional = true }

# password hashing
argon2 = "0.6.0-rc.8"
sysinfo = { version = "0.39.3", optional = true }
tokio-stream = "0.1.17"
futures = "0.3.31"
libc = { version = "0.2", optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls", "stream"] }
rust-embed = { version = "8.11.0", optional = true }
mime_guess = { version = "2.0.5", optional = true }
tar = { version = "0.4", optional = true }
utoipa = { version = "=5.5.0", features = ["chrono"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
