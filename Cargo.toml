[workspace]
members = [
    "apps/admin",
    "apps/cli",
    "apps/insights",
    "apps/monitor",
    "apps/reports",
    "crates/auth",
    "crates/config",
    "crates/ipc",
    "crates/runtime",
    "crates/storage",
]
resolver = "2"

[workspace.package]
version = "0.5.1"
license = "Apache-2.0"

[profile.dev]
# Keep workspace backtrace locations and incremental rebuilds.
debug = "line-tables-only"
incremental = true

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
# Omit dependency debug information during normal development.
debug = 0
